openapi: "3.0.3"
info:
  title: "Colonia de Vacaciones Provincial"
  version: "0.5.0"
  description: "Contrato de Colonia de Vacaciones Provincial. El tutor consulta turnos, inscribe y consulta sus inscripciones. El administrador gestiona turnos, cupos e inscripciones. Sin token responde 401; con un rol que no alcanza, 403. GET /health es público. La solicitud de inscripción responde 202 en pendiente_de_validacion. La residencia se valida después y el cupo se asigna en orden de recepción."
servers:
  -
    url: "/api"
    description: "API a través del proxy del frontend o de Swagger UI; usa el host y puerto del navegador."
tags:
  -
    name: "Turnos"
    description: "Consulta y gestión de turnos, cupos y fechas."
  -
    name: "Inscripciones"
    description: "Registro, validación de residencia, consulta y gestión de inscripciones."
  -
    name: "Infraestructura"
    description: "Disponibilidad del sistema."
paths:
  "/health":
    get:
      tags:
        - "Infraestructura"
      operationId: "obtenerSalud"
      summary: "Comprobar API y conexión a PostgreSQL"
      description: "Comprueba la API y la conexión con PostgreSQL."
      responses:
        "200":
          description: "API y base disponibles."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Health"
        "503":
          "$ref": "#/components/responses/NoDisponible"
      security: []
  "/turnos":
    get:
      tags:
        - "Turnos"
      operationId: "listarTurnos"
      summary: "Listar turnos"
      description: "Rol: tutor o administrador. Devuelve todos los turnos con confirmados, disponibles y en espera calculados."
      responses:
        "200":
          description: "Turnos registrados."
          content:
            "application/json":
              schema:
                type: "array"
                items:
                  "$ref": "#/components/schemas/Turno"
        "500":
          "$ref": "#/components/responses/ErrorInterno"
        "401":
          "$ref": "#/components/responses/NoAutenticado"
        "403":
          "$ref": "#/components/responses/SinPermiso"
    post:
      tags:
        - "Turnos"
      operationId: "crearTurno"
      summary: "Crear un turno"
      description: "Rol: administrador. La convocatoria y la sede deben existir en el catálogo precargado; si no, 400."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/TurnoNuevo"
      responses:
        "201":
          description: "Turno creado."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Turno"
          headers:
            Location:
              description: "URI relativa del recurso creado, resuelta respecto a la URL de la solicitud; conserva el prefijo del proxy."
              schema:
                type: "string"
              example: "turnos/1"
        "400":
          "$ref": "#/components/responses/Invalido"
        "500":
          "$ref": "#/components/responses/ErrorInterno"
        "401":
          "$ref": "#/components/responses/NoAutenticado"
        "403":
          "$ref": "#/components/responses/SinPermiso"
  "/turnos/{id}":
    parameters:
      -
        name: "id"
        in: "path"
        required: true
        description: "Identificador del recurso."
        schema:
          type: "integer"
          minimum: 1
        example: 1
    get:
      tags:
        - "Turnos"
      operationId: "obtenerTurno"
      summary: "Consultar un turno"
      description: "Rol: tutor o administrador."
      responses:
        "200":
          description: "Detalle del turno."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Turno"
        "400":
          "$ref": "#/components/responses/Invalido"
        "404":
          "$ref": "#/components/responses/NoEncontrado"
        "500":
          "$ref": "#/components/responses/ErrorInterno"
        "401":
          "$ref": "#/components/responses/NoAutenticado"
        "403":
          "$ref": "#/components/responses/SinPermiso"
    patch:
      tags:
        - "Turnos"
      operationId: "actualizarTurno"
      summary: "Actualizar cupos, fechas o nombre del turno"
      description: "Rol: administrador. No invalida inscripciones existentes. Un cupo menor que los confirmados responde 409. Si el cupo aumenta, las solicitudes ya elegibles del turno avanzan en orden de recepción y no se adelantan las que siguen pendientes de validación."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/TurnoActualizacion"
      responses:
        "200":
          description: "Turno actualizado, con cantidades recalculadas."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Turno"
        "400":
          "$ref": "#/components/responses/Invalido"
        "404":
          "$ref": "#/components/responses/NoEncontrado"
        "409":
          "$ref": "#/components/responses/Conflicto"
        "500":
          "$ref": "#/components/responses/ErrorInterno"
        "401":
          "$ref": "#/components/responses/NoAutenticado"
        "403":
          "$ref": "#/components/responses/SinPermiso"
  "/inscripciones":
    post:
      tags:
        - "Inscripciones"
      operationId: "crearInscripcion"
      summary: "Inscribir a un chico en un turno"
      description: "Rol: tutor. El tutor sale del token. Requiere período abierto (apertura inclusiva y cierre exclusivo; si no, 409) y edad de 6 a 12 años inclusive al registrar la solicitud, con la fecha del servidor en America/Argentina/Buenos_Aires (si no, 400). Una sola inscripción activa por DNI y convocatoria, incluso entre turnos y sedes diferentes y con pedidos concurrentes (si no, 409). La convocatoria se obtiene del turno. Responde 202 con estado pendiente_de_validacion y el orden de recepción; todavía no confirma cupo. Una nueva solicitud tras cancelación o rechazo recibe nuevo orden. Confirma solo a quien reside en la jurisdicción y no adelanta solicitudes anteriores pendientes del mismo turno. Una falla técnica deja la solicitud pendiente."
      parameters:
        - name: "Idempotency-Key"
          in: "header"
          required: false
          description: "Clave generada por el cliente para esta solicitud y reutilizada en sus reintentos. Se asocia al tutor autenticado. Misma clave y datos normalizados devuelve el 202, cuerpo y Location originales, incluso si cambió el estado o cerró el período; consultar GET para el estado actual. Misma clave con otros datos devuelve 409. Los errores no guardan la clave. Sin este header se mantiene la unicidad por DNI, pero no se recupera la respuesta original. Una nueva solicitud tras cancelación o rechazo requiere una clave nueva. Las claves aceptadas no expiran automáticamente."
          schema:
            type: "string"
            minLength: 1
            maxLength: 128
            pattern: "^[A-Za-z0-9._:-]{1,128}$"
          example: "d42a7862-2a20-44d8-85e0-f0ea516ac77c"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/InscripcionNueva"
      responses:
        "202":
          description: "Aceptación original persistida, pendiente de validar residencia; todavía no confirma cupo. Un reintento idempotente reproduce esta respuesta, no el estado actual de la inscripción."
          content:
            application/json:
              schema:
                allOf:
                  - "$ref": "#/components/schemas/Inscripcion"
                  - type: "object"
                    properties:
                      estado:
                        type: "string"
                        enum: [pendiente_de_validacion]
          headers:
            Location:
              description: "URI relativa para consultar el estado, resuelta respecto a la URL de la solicitud."
              schema:
                type: "string"
              example: "inscripciones/1"
        "400":
          "$ref": "#/components/responses/Invalido"
        "404":
          "$ref": "#/components/responses/NoEncontrado"
        "409":
          "$ref": "#/components/responses/Conflicto"
        "500":
          "$ref": "#/components/responses/ErrorInterno"
        "401":
          "$ref": "#/components/responses/NoAutenticado"
        "403":
          "$ref": "#/components/responses/SinPermiso"
    get:
      tags:
        - "Inscripciones"
      operationId: "listarInscripciones"
      summary: "Consultar inscripciones según el rol"
      description: "Rol: tutor o administrador. El tutor ve solo sus inscripciones; el administrador, todas. Ordenadas por orden de recepción."
      responses:
        "200":
          description: "Inscripciones accesibles para el usuario."
          content:
            "application/json":
              schema:
                type: "array"
                items:
                  "$ref": "#/components/schemas/Inscripcion"
        "500":
          "$ref": "#/components/responses/ErrorInterno"
        "401":
          "$ref": "#/components/responses/NoAutenticado"
        "403":
          "$ref": "#/components/responses/SinPermiso"
  "/inscripciones/{id}":
    parameters:
      -
        name: "id"
        in: "path"
        required: true
        description: "Identificador del recurso."
        schema:
          type: "integer"
          minimum: 1
        example: 1
    get:
      tags:
        - "Inscripciones"
      operationId: "obtenerInscripcion"
      summary: "Consultar una inscripción"
      description: "Rol: tutor o administrador. Para un tutor, una inscripción ajena responde 404, igual que una inexistente."
      responses:
        "200":
          description: "Detalle de inscripción."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Inscripcion"
        "400":
          "$ref": "#/components/responses/Invalido"
        "404":
          "$ref": "#/components/responses/NoEncontrado"
        "500":
          "$ref": "#/components/responses/ErrorInterno"
        "401":
          "$ref": "#/components/responses/NoAutenticado"
        "403":
          "$ref": "#/components/responses/SinPermiso"
    patch:
      tags: [Inscripciones]
      operationId: "corregirInscripcion"
      summary: "Corregir datos de una inscripción"
      description: "Rol: administrador. Corrige nombre, apellido, fecha de nacimiento o DNI del mismo chico sin cambiar turno, convocatoria, estado ni orden de recepción. Vuelve a comprobar la edad a la fecha original de inscripción (si no, 400). No corrige inscripciones canceladas o rechazadas (409). Si cambia el DNI, consulta el padrón antes de aceptar el cambio: sin residencia responde 409 y el DNI anterior queda igual; si el padrón no responde, 503 y tampoco se modifica. Un DNI que ya tiene otra inscripción activa en la convocatoria responde 409."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/InscripcionCorreccion"
            example:
              chico:
                apellido: "Gómez"
      responses:
        "200":
          description: "Inscripción corregida; conserva estado y orden original."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Inscripcion"
        "400":
          "$ref": "#/components/responses/Invalido"
        "404":
          "$ref": "#/components/responses/NoEncontrado"
        "409":
          "$ref": "#/components/responses/Conflicto"
        "500":
          "$ref": "#/components/responses/ErrorInterno"
        "503":
          "$ref": "#/components/responses/PadronNoDisponible"
        "401":
          "$ref": "#/components/responses/NoAutenticado"
        "403":
          "$ref": "#/components/responses/SinPermiso"
  "/inscripciones/{id}/cancelaciones":
    parameters:
      - name: "id"
        in: "path"
        required: true
        description: "Identificador de la inscripción a cancelar."
        schema:
          type: "integer"
          minimum: 1
        example: 1
    post:
      tags: [Inscripciones]
      operationId: "cancelarInscripcion"
      summary: "Cancelar una inscripción con motivo"
      description: "Rol: administrador. Cancela con motivo obligatorio. Puede cancelar una solicitud pendiente, confirmada o en espera. Si estaba confirmada, libera la plaza y la asignación continúa en orden. Cancelar una pendiente o en espera no libera una plaza ocupada. Una cancelada deja de bloquear el turno y no puede confirmarse por un resultado tardío del padrón. Una inscripción cancelada o rechazada devuelve 409."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CancelacionNueva"
            example:
              motivo: "Solicitud de baja del tutor."
      responses:
        "200":
          description: "Inscripción actualizada a cancelada, con su motivo."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Inscripcion"
        "400":
          "$ref": "#/components/responses/Invalido"
        "404":
          "$ref": "#/components/responses/NoEncontrado"
        "409":
          "$ref": "#/components/responses/Conflicto"
        "500":
          "$ref": "#/components/responses/ErrorInterno"
        "401":
          "$ref": "#/components/responses/NoAutenticado"
        "403":
          "$ref": "#/components/responses/SinPermiso"
components:
  schemas:
    TurnoNuevo:
      type: "object"
      additionalProperties: false
      required:
        - "convocatoriaId"
        - "sedeId"
        - "nombre"
        - "fechaInicio"
        - "fechaFin"
        - "inscripcionAbreEn"
        - "inscripcionCierraEn"
        - "cupoTotal"
      properties:
        convocatoriaId:
          type: "string"
          minLength: 1
          example: "verano-2027"
          description: "Identifica la convocatoria provincial, compartida por todos sus turnos y sedes."
        sedeId:
          type: "integer"
          minimum: 1
          example: 1
          description: "Sede del catálogo precargado."
        nombre:
          type: "string"
          minLength: 1
          example: "Turno mañana - Enero"
        fechaInicio:
          type: "string"
          format: "date"
          example: "2027-01-04"
        fechaFin:
          type: "string"
          format: "date"
          example: "2027-01-29"
        inscripcionAbreEn:
          type: "string"
          format: "date-time"
          description: "Fecha y hora con zona horaria explícita."
          example: "2026-12-01T09:00:00-03:00"
        inscripcionCierraEn:
          type: "string"
          format: "date-time"
          description: "Fecha y hora con zona horaria explícita."
          example: "2026-12-20T18:00:00-03:00"
        cupoTotal:
          type: "integer"
          minimum: 0
          example: 30
      description: "Inicio de actividad no posterior al fin. Apertura de inscripción anterior al cierre y cierre no posterior al inicio de actividad."
    TurnoActualizacion:
      type: "object"
      additionalProperties: false
      minProperties: 1
      properties:
        nombre:
          type: "string"
          minLength: 1
          example: "Turno mañana - Enero"
        fechaInicio:
          type: "string"
          format: "date"
          example: "2027-01-04"
        fechaFin:
          type: "string"
          format: "date"
          example: "2027-01-29"
        inscripcionAbreEn:
          type: "string"
          format: "date-time"
          description: "Fecha y hora con zona horaria explícita."
          example: "2026-12-01T09:00:00-03:00"
        inscripcionCierraEn:
          type: "string"
          format: "date-time"
          description: "Fecha y hora con zona horaria explícita."
          example: "2026-12-20T18:00:00-03:00"
        cupoTotal:
          type: "integer"
          minimum: 0
          example: 30
      description: "Actualización parcial. Validar las fechas combinando valores actuales y nuevos. El cupo no puede ser inferior a las inscripciones confirmadas. Un aumento confirma en orden a quien ya está en lista de espera, sin adelantar solicitudes pendientes de validación del mismo turno. Sede y convocatoria no se modifican."
    Turno:
      type: "object"
      required:
        - "id"
        - "convocatoriaId"
        - "sedeId"
        - "nombre"
        - "fechaInicio"
        - "fechaFin"
        - "inscripcionAbreEn"
        - "inscripcionCierraEn"
        - "cupoTotal"
        - "confirmados"
        - "disponibles"
        - "enEspera"
      properties:
        convocatoriaId:
          type: "string"
          minLength: 1
          example: "verano-2027"
          description: "Identifica la convocatoria provincial, compartida por todos sus turnos y sedes."
        sedeId:
          type: "integer"
          minimum: 1
          example: 1
          description: "Sede del catálogo precargado."
        id:
          type: "integer"
          minimum: 1
        nombre:
          type: "string"
          minLength: 1
          example: "Turno mañana - Enero"
        fechaInicio:
          type: "string"
          format: "date"
          example: "2027-01-04"
        fechaFin:
          type: "string"
          format: "date"
          example: "2027-01-29"
        inscripcionAbreEn:
          type: "string"
          format: "date-time"
          description: "Fecha y hora con zona horaria explícita."
          example: "2026-12-01T09:00:00-03:00"
        inscripcionCierraEn:
          type: "string"
          format: "date-time"
          description: "Fecha y hora con zona horaria explícita."
          example: "2026-12-20T18:00:00-03:00"
        cupoTotal:
          type: "integer"
          minimum: 0
          example: 30
        confirmados:
          type: "integer"
          minimum: 0
        disponibles:
          type: "integer"
          minimum: 0
          description: "Cupo total menos confirmados. Valor informativo, no reserva una plaza."
        enEspera:
          type: "integer"
          minimum: 0
    Chico:
      type: "object"
      additionalProperties: false
      required:
        - "documento"
        - "nombre"
        - "apellido"
        - "fechaNacimiento"
      properties:
        documento:
          type: "string"
          pattern: "^[0-9]{7,8}$"
          example: "55123456"
          description: "DNI argentino, sin puntos. Identifica al chico para la unicidad de inscripción activa en la convocatoria."
        nombre:
          type: "string"
          minLength: 1
          example: "Sofía"
        apellido:
          type: "string"
          minLength: 1
          example: "Gómez"
        fechaNacimiento:
          type: "string"
          format: "date"
          example: "2017-05-10"
          description: "Debe tener entre 6 y 12 años cumplidos al registrar la inscripción, no al inicio del turno. Se calcula con la fecha del servidor en America/Argentina/Buenos_Aires; no se recibe una edad declarada."
    InscripcionNueva:
      type: "object"
      additionalProperties: false
      required:
        - "turnoId"
        - "chico"
      properties:
        turnoId:
          type: "integer"
          minimum: 1
          example: 1
        chico:
          "$ref": "#/components/schemas/Chico"
      description: "La convocatoria y sede se derivan del turno elegido; no se reciben de nuevo en esta solicitud. No recibe tutorId: el tutor es el usuario del token."
    Inscripcion:
      type: "object"
      required:
        - "id"
        - "turnoId"
        - "chico"
        - "estado"
        - "ordenRecepcion"
        - "creadoEn"
      properties:
        id:
          type: "integer"
          minimum: 1
        turnoId:
          type: "integer"
          minimum: 1
        chico:
          "$ref": "#/components/schemas/Chico"
        estado:
          "$ref": "#/components/schemas/EstadoInscripcion"
        ordenRecepcion:
          type: "integer"
          minimum: 1
          description: "Orden global e inmutable de admisión durable, generado bajo el bloqueo del turno antes de consultar el padrón. Puede tener saltos. Se usa para asignar plazas dentro del turno sin adelantar solicitudes anteriores pendientes o todavía en proceso de persistencia. No representa el momento del clic, la llegada al gateway ni la posición actual en espera."
        creadoEn:
          type: "string"
          format: "date-time"
          description: "Fecha y hora con zona horaria explícita."
        motivoRechazo:
          type: "string"
          description: "Presente en rechazada, por ejemplo residencia fuera de la jurisdicción."
        motivoCancelacion:
          type: "string"
          description: "Presente cuando la inscripción está cancelada."
    EstadoInscripcion:
      type: "string"
      enum: [pendiente_de_validacion, confirmada, en_lista_de_espera, rechazada, cancelada]
      description: "Activas: pendiente_de_validacion, confirmada y en_lista_de_espera. Rechazada y cancelada son finales y no bloquean una nueva solicitud. Una falla técnica del padrón mantiene pendiente_de_validacion; no equivale a rechazo."
    InscripcionCorreccion:
      type: "object"
      additionalProperties: false
      required: [chico]
      properties:
        chico:
          type: "object"
          additionalProperties: false
          minProperties: 1
          properties:
            documento:
              "$ref": "#/components/schemas/Chico/properties/documento"
            nombre:
              "$ref": "#/components/schemas/Chico/properties/nombre"
            apellido:
              "$ref": "#/components/schemas/Chico/properties/apellido"
            fechaNacimiento:
              "$ref": "#/components/schemas/Chico/properties/fechaNacimiento"
    CancelacionNueva:
      type: "object"
      additionalProperties: false
      required: [motivo]
      properties:
        motivo:
          type: "string"
          minLength: 1
          pattern: '\S'
          description: "Motivo obligatorio; no puede contener únicamente espacios."
    Health:
      type: "object"
      required:
        - "status"
        - "database"
      properties:
        status:
          type: "string"
          enum:
            - "ok"
        database:
          type: "string"
          enum:
            - "ok"
    ProblemDetails:
      type: "object"
      required:
        - "type"
        - "title"
        - "status"
        - "detail"
        - "instance"
      properties:
        type:
          type: "string"
          format: "uri"
          example: "about:blank"
        title:
          type: "string"
        status:
          type: "integer"
          minimum: 400
          maximum: 599
        detail:
          type: "string"
        instance:
          type: "string"
          description: "Ruta solicitada vista por la API, sin el prefijo /api del proxy."
          example: "/turnos"
  responses:
    Invalido:
      description: "Datos, fechas o JSON inválidos, incluida edad fuera de 6 a 12 años al inscribirse."
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/ProblemDetails"
          example:
            type: "about:blank"
            title: "Datos inválidos"
            status: 400
            detail: "Datos, fechas o JSON inválidos, incluida edad fuera de 6 a 12 años al inscribirse."
            instance: "/turnos"
    NoEncontrado:
      description: "El recurso no existe."
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/ProblemDetails"
          example:
            type: "about:blank"
            title: "No encontrado"
            status: 404
            detail: "El recurso no existe."
            instance: "/turnos"
    Conflicto:
      description: "Ya existe una inscripción activa del chico en la convocatoria, inscripción en estado final, período cerrado, cupo inferior a los confirmados o Idempotency-Key reutilizada con otros datos. La falta de cupo genera lista de espera, no conflicto."
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/ProblemDetails"
          example:
            type: "about:blank"
            title: "Conflicto"
            status: 409
            detail: "Ya existe una inscripción activa del chico en la convocatoria, inscripción en estado final, período cerrado o cupo inferior a los confirmados. La falta de cupo genera lista de espera, no conflicto."
            instance: "/turnos"
    ErrorInterno:
      description: "Error inesperado."
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/ProblemDetails"
          example:
            type: "about:blank"
            title: "Error interno"
            status: 500
            detail: "Error inesperado."
            instance: "/turnos"
    NoDisponible:
      description: "No se pudo comprobar la conexión con PostgreSQL."
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/ProblemDetails"
          example:
            type: "about:blank"
            title: "Servicio no disponible"
            status: 503
            detail: "No se pudo comprobar la conexión con PostgreSQL."
            instance: "/health"
    PadronNoDisponible:
      description: "No se pudo consultar el padrón. El cambio de DNI no se aplicó."
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/ProblemDetails"
          example:
            type: "about:blank"
            title: "Servicio no disponible"
            status: 503
            detail: "No se pudo consultar el padrón. La inscripción no se modificó."
            instance: "/inscripciones/1"
    NoAutenticado:
      description: "Falta el token, está vencido o no supera la validación de firma, emisor o audiencia."
      headers:
        WWW-Authenticate:
          schema:
            type: "string"
            example: "Bearer realm=\"colonia\""
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/ProblemDetails"
          example:
            type: "about:blank"
            title: "No autenticado"
            status: 401
            detail: "Falta el header \"Authorization: Bearer <token>\"."
            instance: "/turnos"
    SinPermiso:
      description: "El token es válido pero el rol no alcanza para esta operación."
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/ProblemDetails"
          example:
            type: "about:blank"
            title: "Sin permiso"
            status: 403
            detail: "El rol no alcanza para esta operación."
            instance: "/turnos"
  securitySchemes:
    keycloak:
