<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Colonia de Vacaciones Provincial</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 12vh auto; padding: 24px; color: #16342e; background: #f4f7f5; }
    main { background: white; border: 1px solid #cbdcd5; border-radius: 16px; padding: 32px; }
    h1 { line-height: 1.15; } p { line-height: 1.6; }
    a { color: #075e48; } #estado { padding: 16px; background: #edf4f0; border-radius: 8px; }
  </style>
</head>
<body>
  <main>
    <p>PROYECTO · ARQUITECTURA DE SOFTWARE 1</p>
    <h1>Colonia de Vacaciones Provincial</h1>
    <p>Entorno inicial del proyecto. Las pantallas de turnos e inscripciones estarán disponibles en una próxima etapa.</p>
    <p id="estado" role="status">Comprobando conexión con el sistema…</p>
    <a href="/api/health">Consultar estado del sistema</a>
  </main>
  <script>
    fetch('/api/health')
      .then(response => { if (!response.ok) throw new Error(); return response.json(); })
      .then(() => { document.querySelector('#estado').textContent = 'API y base de datos disponibles.'; })
      .catch(() => { document.querySelector('#estado').textContent = 'No se pudo comprobar la disponibilidad del sistema.'; });
  </script>
</body>
</html>
